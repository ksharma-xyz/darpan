name: Publish snapshot

# Publishes the current main to the Central Portal snapshot repository
# (https://central.sonatype.com/repository/maven-snapshots/) so downstream apps
# can consume unreleased changes without waiting for a tagged release.
#
# Division of labour:
#   - main is kept on an x.y.z-SNAPSHOT version between releases. Every push
#     here republishes that mutable coordinate.
#   - Release and release-candidate versions are published only by
#     publish-release.yml, and only in response to a tag.
#
# A non-SNAPSHOT version on main therefore means a release commit is passing
# through, and this workflow deliberately does nothing: publishing it here as
# well would race publish-release.yml for the same coordinate.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'ksharma-xyz/darpan'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION_NAME from gradle.properties
        id: version
        run: |
          v=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version on this commit: $v"

      - name: Skip release versions
        if: ${{ !contains(steps.version.outputs.value, '-SNAPSHOT') }}
        run: |
          echo "::notice::Version ${{ steps.version.outputs.value }} is not a SNAPSHOT."
          echo "::notice::Release and RC versions are published by publish-release.yml"
          echo "::notice::in response to a tag. Nothing to do here."

      - name: Set up JDK 21
        if: contains(steps.version.outputs.value, '-SNAPSHOT')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        if: contains(steps.version.outputs.value, '-SNAPSHOT')
        uses: gradle/actions/setup-gradle@v4

      - name: Publish snapshot to Central Portal
        if: contains(steps.version.outputs.value, '-SNAPSHOT')
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]; then
            echo "::notice::Sonatype secrets not configured yet. Skipping publication."
            echo "::notice::Add SONATYPE_USERNAME, SONATYPE_PASSWORD, SIGNING_KEY, SIGNING_KEY_PASSWORD"
            echo "::notice::in repo settings to enable. See docs/publishing.md."
            exit 0
          fi
          # publishToMavenCentral, not publishAndReleaseToMavenCentral: snapshots
          # go straight to the snapshot repository and have no staging deployment
          # to release.
          ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace
