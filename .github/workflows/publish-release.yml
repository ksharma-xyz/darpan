name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

jobs:
  publish:
    if: github.repository == 'ksharma-xyz/darpan'
    runs-on: macos-latest
    permissions:
      contents: write   # needed for softprops/action-gh-release to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # A tag and gradle.properties that disagree would silently publish the
      # wrong coordinate, and Maven Central releases cannot be taken back.
      - name: Verify tag matches VERSION_NAME
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "Tag: $tag"
          echo "VERSION_NAME: $version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag '$tag' does not match VERSION_NAME '$version' (expected 'v$version')."
            echo "::error::Bump VERSION_NAME in gradle.properties and retag."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::Refusing to publish a SNAPSHOT version as a release."
              exit 1
              ;;
          esac

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central (Central Portal)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]; then
            echo "::error::Sonatype secrets not configured. Cannot publish release."
            echo "::error::Add SONATYPE_USERNAME, SONATYPE_PASSWORD, SIGNING_KEY, SIGNING_KEY_PASSWORD"
            echo "::error::in repo settings before tagging. See TODO.md / docs/publishing.md."
            exit 1
          fi
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Without this an RC tag would be marked "Latest release" on the repo
          # front page, pointing public consumers at a candidate build.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-rc') }}
